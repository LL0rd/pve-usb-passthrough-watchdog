# /etc/default/pve-usb-passthrough-watchdog
# Guest that owns the USB device
VMID=100
# vendor:product as shown by lsusb (here: dresden elektronik ConBee II)
USB_ID=1cf1:0030
# QEMU device id, i.e. the usbN key in `qm config <VMID>`
DEVICE_ID=usb0
# Seconds between checks
INTERVAL=15
# Seconds the device may stay host-owned before it is re-attached
GRACE=60
# Seconds to wait after a re-attach before checking again
COOLDOWN=300
